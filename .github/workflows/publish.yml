name: publish

on:
  push:
    branches: [main]
  pull_request:          # PR'larda yalnızca derleme + link kontrolü (yayın yok)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18          # yereldeki sürümle aynı tutun

      # R kodu freeze ile önceden çalıştırılır (_freeze/ commit edilir) -> CI'da R kurulumu gerekmez.
      # Çift dil: önce Türkçe (varsayılan profil → _site/), sonra İngilizce (→ _site/en/).
      # Sıra önemli: Türkçe tam derleme _site/ klasörünü temizler.
      - name: Render (tr)
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render (en)
        run: quarto render --profile en

      - name: İç link kontrolü
        uses: lycheeverse/lychee-action@v2
        with:
          # 404 sayfası site-url'e göre mutlak yol kullanır; kontrol dışı
          args: --offline --no-progress --exclude-path _site/404.html '_site/**/*.html'
          fail: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
