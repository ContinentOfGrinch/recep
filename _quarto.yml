project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "proje/*.qmd"
    - "ekip/*.qmd"
    - "ciktilar/*.qmd"
    - "veri-kod/*.qmd"
    - "araclar/*.qmd"
    - "haberler/**/*.qmd"
    - "iletisim/*.qmd"
  resources:
    - ".nojekyll"
    - "assets/fonts/"
    - "assets/marka/"
    - "assets/sanat/"
    - "assets/js/kure.js"

lang: tr

execute:
  freeze: auto   # R çıktıları _freeze/ içine yazılır ve commit edilir; CI'da R gerekmez

website:
  title: "recep"
  description: "Çevre, Temiz Enerji ve Ekonomi Politikaları Araştırma Grubu — AB Sınırda Karbon Düzenleme Mekanizması'nın (SKDM/CBAM) Türkiye ekonomisine etkileri."
  site-url: "https://continentofgrinch.github.io/recep/"
  repo-url: "https://github.com/ContinentOfGrinch/recep"
  repo-actions: [edit, issue]
  favicon: assets/favicon.svg
  image: assets/og.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    background: dark
    pinned: true
    collapse-below: xl
    logo: assets/marka/amblem-nav.svg
    logo-alt: "recep amblemi: dünya küresi ve AB–Türkiye bağlantısı"
    title: "recep"
    left:                                  # merkez logonun solu
      - text: "proje"
        href: proje/index.qmd
      - text: "ekip"
        href: ekip/index.qmd
      - text: "çıktılar"
        href: ciktilar/index.qmd
    right:                                 # merkez logonun sağı
      - text: "veri ve kod"
        href: veri-kod/index.qmd
      - text: "araçlar"
        href: araclar/index.qmd
      - text: "haberler"
        href: haberler/index.qmd
      - text: "iletişim"
        href: iletisim/index.qmd
    tools:
      - icon: github
        href: "https://github.com/ContinentOfGrinch/recep"
        aria-label: GitHub

  sidebar:
    - id: proje
      title: "proje"
      style: floating
      contents:
        - auto: proje
    - id: ciktilar
      title: "çıktılar"
      style: floating
      contents:
        - auto: ciktilar
    - id: veri-kod
      title: "veri ve kod"
      style: floating
      contents:
        - auto: veri-kod
    - id: araclar
      title: "araçlar"
      style: floating
      contents:
        - auto: araclar

  page-footer:
    border: true
    left: "© 2026 recep · çevre, temiz enerji ve ekonomi politikaları araştırma grubu · [tübitak 1001](/proje/tubitak.qmd) destekli"
    right:
      - icon: github
        href: "https://github.com/ContinentOfGrinch/recep"
        aria-label: GitHub
      - icon: envelope
        href: iletisim/index.qmd
        aria-label: İletişim

format:
  html:
    theme:
      dark: [theme.scss, theme-dark.scss]   # ilk sıradaki tema varsayılandır: gece
      light: [theme.scss]
    respect-user-color-scheme: false
    css: assets/fonts.css
    include-in-header:
      text: |
        <meta name="theme-color" content="#05080D">
        <script>
          // Varsayılan gece teması: eski sürümlerden kalmış tema tercihini bir kez sıfırla
          try {
            if (localStorage.getItem("recep-tema") !== "v2") {
              var eski = localStorage.getItem("quarto-color-scheme");
              localStorage.removeItem("quarto-color-scheme");
              localStorage.setItem("recep-tema", "v2");
              if (eski) location.reload();
            }
          } catch (e) {}
        </script>
    include-after-body:
      text: |
        <script>
          // dönen dünya küresi: sayfa derinliğinden bağımsız yükle
          (function () {
            var m = document.querySelector('meta[name="quarto:offset"]');
            var s = document.createElement("script");
            s.src = (m ? m.content : "./") + "assets/js/kure.js";
            s.defer = true;
            document.body.appendChild(s);
          })();
        </script>
    toc: true
    toc-depth: 3
    toc-title: "bu sayfada"
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    code-link: true
    highlight-style:
      light: github
      dark: github-dark
    html-math-method: katex
    link-external-icon: false
    link-external-newwindow: true
    fig-responsive: true
    grid:
      body-width: 860px
      sidebar-width: 250px
      margin-width: 230px
